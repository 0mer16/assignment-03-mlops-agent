[project]
name = "mlops-agent"
version = "0.1.0"
description = "Conversational MLOps agent over DVC, MLflow, Airflow and Kubernetes"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "mlflow>=3.1",
    "dvc>=3.50",
    "kubernetes>=30.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "joblib>=1.4",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
mlops-agent = "agent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a real service, skipped in CI"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
